<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acompanhamento | HK Nippon store</title>
    <link rel="stylesheet" href="/loja/styles.css">
</head>
<body class="order-page">
    <main class="tracking-page">
        <header class="store-topbar checkout-topbar">
            <a class="brand-link" href="/loja">
                <span data-app-name>HK Nippon store</span>
            </a>

            <div class="topbar-actions">
                <a class="cart-link muted-link" href="/loja">Continuar comprando</a>
                <a class="cart-link" href="/loja/carrinho">Carrinho</a>
            </div>
        </header>

        <section class="tracking-shell">
            <div class="tracking-heading">
                <p class="eyebrow">Acompanhamento</p>
                <h1>Acompanhe seu pedido</h1>
            </div>

            <p class="tracking-intro">Confira o pagamento e cada etapa da entrega. <a href="/loja/conta#meus-pedidos">Ver meus pedidos</a></p>
            <form id="tracking-form" class="tracking-form hidden">
                <label>
                    Numero do pedido
                    <input id="pedido-id" name="pedidoId" type="number" min="1" step="1" required>
                </label>

                <button type="submit">Buscar pedido</button>
            </form>

            <details id="ultimo-pedido-detalhes" class="tracking-shortcut hidden">
                <summary>Atalho do último pedido neste navegador</summary>
            <aside id="ultimo-pedido" class="ultimo-pedido hidden" aria-label="Ultimo pedido nesta sessao"></aside>
            </details>

            <section id="tracking-result" class="tracking-result hidden"></section>
            <p id="tracking-feedback" class="feedback" role="status"></p>
            <p class="store-support" data-atendimento-texto></p>
        </section>
    </main>

    <script src="/loja/acompanhamento.js" type="module"></script>
</body>
</html>
