<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loja Japao Admin</title>
    <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
    <main class="page">
        <section id="login-view" class="login-view">
            <form id="login-form" class="login-panel">
                <div>
                    <p class="eyebrow">Admin</p>
                    <h1>Loja Japao</h1>
                </div>

                <label>
                    Email
                    <input id="login-email" name="email" type="email" autocomplete="email" required>
                </label>

                <label>
                    Senha
                    <input id="login-senha" name="senha" type="password" autocomplete="current-password" required>
                </label>

                <button type="submit">Entrar</button>
                <p id="login-feedback" class="feedback" role="status"></p>
            </form>
        </section>

        <section id="app-view" class="app-view hidden">
            <aside class="sidebar">
                <div>
                    <p class="eyebrow">Admin</p>
                    <h1>Loja Japao</h1>
                </div>

                <nav class="nav">
                    <button class="nav-button active" type="button" data-view="dashboard">Dashboard</button>
                    <button class="nav-button" type="button" data-view="produtos">Produtos</button>
                </nav>

                <button id="logout-button" class="ghost-button" type="button">Sair</button>
            </aside>

            <section class="content">
                <header class="topbar">
                    <div>
                        <p class="eyebrow">Sessao</p>
                        <h2 id="view-title">Dashboard</h2>
                    </div>
                    <button id="refresh-button" type="button">Atualizar</button>
                </header>

                <section id="dashboard-view" class="view-section">
                    <div id="stats-grid" class="stats-grid"></div>
                </section>

                <section id="produtos-view" class="view-section hidden">
                    <form id="produto-form" class="product-form">
                        <label>
                            Nome
                            <input id="produto-nome" name="nome" type="text" required>
                        </label>

                        <label>
                            Preco
                            <input id="produto-preco" name="preco" type="number" min="0.01" step="0.01" required>
                        </label>

                        <label>
                            Estoque
                            <input id="produto-estoque" name="estoque" type="number" min="0" step="1" required>
                        </label>

                        <button type="submit">Cadastrar</button>
                    </form>

                    <div class="table-shell">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Produto</th>
                                    <th>Preco</th>
                                    <th>Estoque</th>
                                    <th>Acoes</th>
                                </tr>
                            </thead>
                            <tbody id="produtos-tbody"></tbody>
                        </table>
                    </div>
                </section>

                <p id="app-feedback" class="feedback" role="status"></p>
            </section>
        </section>
    </main>

    <script src="/admin/app.js" type="module"></script>
</body>
</html>
